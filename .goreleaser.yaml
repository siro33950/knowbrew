# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: knowbrew

builds:
  - id: knowbrew
    main: ./cmd/knowbrew
    binary: knowbrew
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - >-
        -s -w
        -X github.com/siro33950/knowbrew/internal/cli.version={{ .Version }}

archives:
  - id: knowbrew
    ids:
      - knowbrew
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
